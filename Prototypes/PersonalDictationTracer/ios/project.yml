name: HexKeyboardTracer

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HexKeyboardTracer:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - Shared/Sources
      - path: ../../../HexCore/Sources/HexCore/Models/WordRemoval.swift
      - path: ../../../HexCore/Sources/HexCore/Models/WordRemapping.swift
      - path: ../../../HexCore/Sources/HexCore/Models/TranscriptFormatting.swift
    info:
      path: App/Info.plist
      properties:
        NSMicrophoneUsageDescription: Hex records your voice so your private Ronin server can transcribe it.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.nmarch213.HexKeyboardTracer
            CFBundleURLSchemes:
              - hextracer
    entitlements:
      path: App/HexKeyboardTracer.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nmarch213.HexKeyboardTracer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nmarch213.HexKeyboardTracer
        PRODUCT_NAME: Hex Keyboard Tracer
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: HexKeyboardExtension

  HexKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard/Sources
      - Shared/Sources
    info:
      path: Keyboard/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Keyboard/HexKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nmarch213.HexKeyboardTracer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nmarch213.HexKeyboardTracer.Keyboard
        PRODUCT_NAME: Hex Prototype
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  HexKeyboardTracer:
    build:
      targets:
        HexKeyboardTracer: all
    run:
      config: Debug
